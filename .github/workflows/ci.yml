      - run: cmake -B sampler/build -S sampler -DCMAKE_BUILD_TYPE=Release && cmake --build sampler/build -j"$(nproc)"
      - name: DSP test
        run: sampler/build/sampler-test

  grain:
    name: Grain synth (CLAP + LV2)
    runs-on: ubuntu-24.04
