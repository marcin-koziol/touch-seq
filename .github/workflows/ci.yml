      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - run: cmake -B grain/build -S grain -DCMAKE_BUILD_TYPE=Release && cmake --build grain/build -j"$(nproc)"
      - name: DSP test
        run: grain/build/grain-test

  eq:
    name: EQ plugin (CLAP + LV2)
    runs-on: ubuntu-22.04
